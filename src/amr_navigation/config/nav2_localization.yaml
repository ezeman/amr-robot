amcl:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: "scan"
    tf_broadcast: true
    transform_tolerance: 1.0
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""
    frame_id: "map"

lifecycle_manager:
  ros__parameters:
    use_sim_time: False
    autostart: true
    node_names:
      - map_server
      - amcl
