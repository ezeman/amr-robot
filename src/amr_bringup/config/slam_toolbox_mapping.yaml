slam_toolbox:
  ros__parameters:
    mode: mapping
    use_sim_time: false

    map_frame: map
    odom_frame: odom
    # Use base_footprint as the planar base frame.
    base_frame: base_footprint
    scan_topic: /scan

    # Map quality / stability defaults (good starting point for corridors)
    resolution: 0.05
    max_laser_range: 25.0
    # For in-place rotations, keep scan throughput high to help scan matching.
    minimum_time_interval: 0.0
    throttle_scans: 1
    transform_timeout: 0.5
    tf_buffer_duration: 30.0

    # Publish map->odom continuously
    transform_publish_period: 0.02
    map_update_interval: 1.0

    # Scan matching / loop closure
    use_scan_matching: true
    use_scan_barycenter: true
    do_loop_closing: true
    loop_search_maximum_distance: 3.0

    # Start recording only after real motion (reduce noise).
    # If mapping doesn't update when doing small rotations near a spot, reduce these.
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.05

    # Interactive mode can be helpful during mapping; keep enabled by default
    enable_interactive_mode: true
