wfh_odom_runner:
  ros__parameters:
    target_distance_m: 1.0
    linear_x: 0.20
    include_backward: false
    rounds: 1
    forward_distance_m: 1.0
    backward_distance_m: 1.0
    backward_linear_x: -0.20
    rate_hz: 20.0
    max_duration_sec: 15.0
    max_total_duration_sec: 300.0
    settle_time_sec: 0.5
    odom_topic: /odom
    cmd_vel_topic: /cmd_vel
    log_interval_sec: 0.2

wfh_drive_on_heading_client:
  ros__parameters:
    distance_m: 1.0
    speed_mps: 0.20
    time_allowance_sec: 15.0
    action_name: drive_on_heading

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.25, 0.0, 0.6]
    min_velocity: [-0.25, 0.0, -0.6]
    max_accel: [0.6, 0.0, 1.0]
    max_decel: [-0.6, 0.0, -1.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

behavior_server:
  ros__parameters:
    use_sim_time: False
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    behavior_plugins: ["drive_on_heading", "wait"]
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    rotational_acc_lim: 3.0
